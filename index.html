<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><title>Wilson</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00e05a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.png">
<style>
:root{--bg:#f5f6f5;--sf:#fff;--tx:#111412;--mu:#6b726d;--ln:#e3e6e3;--ac:#00e05a;--ac-tx:#06210f;--rd:#e5484d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e100f;--sf:#171a18;--tx:#f1f3f1;--mu:#8a928c;--ln:#262a27;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hide{display:none!important}
header{display:flex;align-items:center;gap:10px;max-width:1040px;margin:0 auto;padding:16px 20px}
header img{width:34px;height:34px}header b{font-size:20px}
header .sp{margin-left:auto;display:flex;gap:8px}
main{max-width:1040px;margin:0 auto;padding:0 20px 40px;display:grid;gap:16px}
@media(min-width:860px){main{grid-template-columns:1.25fr 1fr;align-items:start}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
h2{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer;flex:1 1 auto;text-align:center}
button:hover,.btn:hover{border-color:var(--mu)}button.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-tx)}button:disabled{opacity:.4;cursor:not-allowed}
button.sm{flex:none;padding:7px 12px;font-weight:500}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-top:6px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
label.f{display:block;margin-top:12px;color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>input,.row>select{margin-top:0;flex:1}
.stage{aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center;position:relative}
.stage canvas,.stage video{width:100%;height:100%;object-fit:contain;display:none}
.stage .empty{color:#8a928c;text-align:center;padding:20px;font-size:14px}
.rec{position:absolute;top:10px;left:10px;background:var(--rd);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:8px}
.cam{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.cam button{flex:none;min-width:84px}
.shutter{width:68px;height:68px;border-radius:50%!important;border:4px solid var(--ac)!important;background:var(--sf);padding:0!important;position:relative;min-width:0!important}
.shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ac);transition:.15s}
.shutter.vid{border-color:var(--rd)!important}.shutter.vid::after{background:var(--rd)}
.shutter.on::after{inset:18px;border-radius:6px;background:var(--rd)}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{border:0;border-radius:0;font-weight:500;padding:8px}.seg button.on{background:var(--ac);color:var(--ac-tx);font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--ln);position:relative;cursor:pointer;flex:none;margin:0;padding:0;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.meta{color:var(--mu);font-size:13px;margin-top:10px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .box{width:100%;max-width:360px;text-align:center}
#login img{width:84px;height:84px;margin-bottom:12px}#login h1{font-size:28px;margin-bottom:4px}
#login p{color:var(--mu);margin-bottom:22px}
.or{color:var(--mu);font-size:13px;margin:16px 0}
.err{color:var(--rd);font-size:13px;margin-top:10px;min-height:18px}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#qr{width:200px;height:200px;display:block;margin:12px auto;background:#fff;border-radius:8px}
.sch{font-size:13px;display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;display:none;z-index:9}
</style></head><body>

<section id="login" class="hide"><div class="box">
  <img src="logo.png" alt="Wilson"><h1>Wilson</h1><p>Foto dan video dengan cap waktu serta lokasi</p>
  <button class="pri" id="gLogin" style="width:100%">Masuk dengan Google</button>
  <div class="or">atau dengan email</div>
  <input id="eMail" type="email" placeholder="Email" autocomplete="email">
  <input id="ePass" type="password" placeholder="Kata sandi" autocomplete="current-password">
  <div class="row"><button id="eIn">Masuk</button><button id="eUp">Daftar</button></div>
  <div class="err" id="lErr"></div>
</div></section>

<div id="app" class="hide">
<header><img src="logo.png" alt=""><b>Wilson</b>
  <div class="sp"><button class="sm" id="bBot">Bot WA</button><button class="sm" id="bOut">Keluar</button></div></header>
<main>
<section>
  <div class="card" style="margin-bottom:16px">
    <h2>Tujuan WhatsApp</h2>
    <div class="row" style="margin-top:0">
      <input id="dest" type="tel" placeholder="Nomor, contoh 0812xxxx atau 62812xxxx">
      <button class="sm" id="bPick">Kontak</button><button class="sm" id="bSaveC">Simpan</button>
    </div>
    <select id="saved" class="hide"></select>
  </div>
  <div class="card">
    <div class="stage"><div class="empty" id="empty">Belum ada media.<br>Buka kamera atau unggah foto.</div>
      <canvas id="cv"></canvas><video id="pv" controls playsinline></video><video id="lv" muted playsinline style="display:block!important;position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
      <div class="rec hide" id="rec">REC 00:00</div></div>
    <div class="seg" id="mode"><button data-m="photo" class="on">Foto</button><button data-m="video">Video</button></div>
    <div class="row" id="rStart"><button class="pri" id="bCam">Buka kamera</button><label class="btn" for="fUp">Unggah foto</label></div>
    <div class="cam hide" id="rLive"><button id="bFlip">Balik</button><button class="shutter" id="shut" aria-label="Ambil"></button><button id="bStop">Tutup</button></div>
    <input type="file" id="fUp" accept="image/*" class="hide">
  </div>
</section>
<aside style="display:grid;gap:16px">
  <section class="card"><h2>Cap</h2>
    <div class="opt"><span>Hari dan tanggal</span><input class="sw" type="checkbox" id="oDate" checked></div>
    <div class="opt"><span>Waktu</span><input class="sw" type="checkbox" id="oTime" checked></div>
    <div class="opt"><span>Lokasi</span><input class="sw" type="checkbox" id="oLoc" checked></div>
    <label class="f">Nama lokasi</label><input id="tLoc" placeholder="Mencari lokasi…"><div class="meta" id="gps"></div>
    <label class="f">Catatan</label><input id="tNote" placeholder="Opsional">
    <label class="f">Posisi</label><div class="seg" id="pos"><button data-p="top">Atas</button><button data-p="bottom" class="on">Bawah</button></div>
  </section>
  <section class="card"><h2>Kirim</h2>
    <label class="f" style="margin-top:0">Jadwalkan (kosongkan untuk kirim sekarang)</label><input type="datetime-local" id="when">
    <div class="row"><button class="pri" id="bBotSend" disabled>Kirim lewat bot</button></div>
    <div class="row"><button id="bWA" disabled>WhatsApp biasa</button><button id="bDrive" disabled>Ke Drive</button><button id="bSave" disabled>Simpan</button></div>
  </section>
</aside></main></div>

<dialog id="dlg"><h2>Bot WhatsApp</h2>
  <div class="meta" id="botSt" style="margin-top:0">Menghubungkan…</div>
  <img id="qr" class="hide" alt="QR"><div id="pairBox" class="hide" style="font-size:26px;font-weight:700;letter-spacing:.15em;text-align:center;margin:12px 0"></div>
  <label class="f">Scan dari HP yang sama? Pakai kode tautan</label>
  <div class="row" style="margin-top:6px"><input id="pairNum" type="tel" placeholder="Nomor WhatsApp, contoh 0812xxxx"><button class="sm" id="bPair">Minta kode</button></div>
  <div class="row"><button id="bRs">Mulai ulang</button><button id="bLo">Logout WA</button></div>
  <h2 style="margin-top:18px">Antrean dan jadwal</h2><div id="schList" class="meta" style="margin-top:0">-</div>
  <div class="row"><button id="bClose">Tutup</button></div></dialog>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendEmailVerification,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig,DEFAULT_BOT_URL} from "./config.js";
const $=id=>document.getElementById(id), fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const S={mode:'photo',src:null,time:new Date(),lat:null,lon:null,pos:'bottom',stream:null,facing:'environment',rec:null,vblob:null,live:false,cfg:{contacts:[],botUrl:DEFAULT_BOT_URL,last:''}};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',4000)}

/* ===== Login ===== */
const gp=new GoogleAuthProvider();gp.addScope('https://www.googleapis.com/auth/drive.file');
async function google(){const r=await signInWithPopup(auth,gp);const c=GoogleAuthProvider.credentialFromResult(r);if(c?.accessToken)sessionStorage.dtoken=c.accessToken}
const lerr=e=>$('lErr').textContent=(e.code||e.message||'Gagal').replace('auth/','').replace(/-/g,' ');
$('gLogin').onclick=()=>google().catch(lerr);
$('eIn').onclick=()=>signInWithEmailAndPassword(auth,$('eMail').value,$('ePass').value).catch(lerr);
$('eUp').onclick=()=>createUserWithEmailAndPassword(auth,$('eMail').value,$('ePass').value).then(r=>sendEmailVerification(r.user)).then(()=>toast('Cek email untuk verifikasi, lalu masuk lagi.')).catch(lerr);
$('bOut').onclick=()=>{closeCam();sessionStorage.clear();signOut(auth)};
onAuthStateChanged(auth,async u=>{
  $('login').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);
  if(!u){unG?.();unJ?.();return}
  try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists())Object.assign(S.cfg,s.data())}catch(e){}
  $('dest').value=S.cfg.last||'';renderSaved();locate();watchGateway();watchJobs();
});
const saveCfg=()=>setDoc(doc(db,'users',auth.currentUser.uid),S.cfg).catch(()=>toast('Pengaturan belum tersimpan (cek aturan Firestore).'));

/* ===== Tujuan & kontak ===== */
function renderSaved(){const s=$('saved');s.classList.toggle('hide',!S.cfg.contacts.length);
  s.innerHTML='<option value="">Kontak tersimpan…</option>'+S.cfg.contacts.map((c,i)=>`<option value="${i}">${c.n} · ${c.t}</option>`).join('')}
$('saved').onchange=e=>{if(e.target.value!=='')$('dest').value=S.cfg.contacts[e.target.value].t};
$('bSaveC').onclick=()=>{const t=$('dest').value.trim();if(!t)return;const n=prompt('Nama kontak ini?');if(!n)return;
  S.cfg.contacts.push({n,t});renderSaved();saveCfg()};
$('bPick').onclick=async()=>{
  if(!('contacts' in navigator&&navigator.contacts.select))return toast('Pemilih kontak hanya ada di Chrome Android. Ketik nomor atau pilih dari kontak tersimpan.');
  try{const [c]=await navigator.contacts.select(['name','tel']);if(c?.tel?.[0]){$('dest').value=c.tel[0];if(c.name?.[0]&&!S.cfg.contacts.some(x=>x.t===c.tel[0])){S.cfg.contacts.push({n:c.name[0],t:c.tel[0]});renderSaved();saveCfg()}}}catch(e){}
};
$('dest').onchange=()=>{S.cfg.last=$('dest').value;saveCfg()};

/* ===== Waktu & lokasi ===== */
const tz=d=>{const o=-d.getTimezoneOffset()/60;return o===7?'WIB':o===8?'WITA':o===9?'WIT':'GMT'+(o>=0?'+':'')+o};
const fDate=d=>d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fTime=d=>d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/:/g,'.')+' '+tz(d);
function locate(){if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{S.lat=p.coords.latitude;S.lon=p.coords.longitude;
    $('gps').textContent=`Koordinat: ${S.lat.toFixed(5)}, ${S.lon.toFixed(5)} (±${Math.round(p.coords.accuracy)} m)`;$('tLoc').placeholder='Nama tempat (opsional)';draw()},
   ()=>{$('tLoc').placeholder='Izin lokasi ditolak, ketik manual'},{enableHighAccuracy:true,timeout:12000})}

/* ===== Gambar: satu kanvas untuk pratinjau, foto, dan video ===== */
const cv=$('cv'),x=cv.getContext('2d');
function stamp(w,h,t){
  const L=[];if($('oTime').checked)L.push({t:fTime(t),big:1});if($('oDate').checked)L.push({t:fDate(t)});
  if($('oLoc').checked){const n=$('tLoc').value.trim();if(n)L.push({t:n});if(S.lat!=null)L.push({t:S.lat.toFixed(5)+', '+S.lon.toFixed(5),sm:1})}
  const nt=$('tNote').value.trim();if(nt)L.push({t:nt,sm:1});if(!L.length)return;
  const u=Math.max(w,h*.75)/38,pad=u*.9,fam='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',fs=l=>l.big?u*1.5:l.sm?u*.72:u*.9;
  const H=pad*2+L.reduce((a,l)=>a+fs(l)*1.35,0),y0=S.pos==='top'?0:h-H;
  x.fillStyle='rgba(0,0,0,.58)';x.fillRect(0,y0,w,H);x.fillStyle='#00e05a';x.fillRect(0,y0,u*.22,H);
  x.textBaseline='top';x.textAlign='left';let y=y0+pad;
  L.forEach(l=>{x.font=(l.big?'700 ':'500 ')+fs(l)+'px '+fam;x.fillStyle=l.sm?'#c9cfca':'#fff';let s=l.t;const mw=w-pad*3;
    while(x.measureText(s).width>mw&&s.length>4)s=s.slice(0,-2);if(s!==l.t)s+='…';x.fillText(s,pad+u*.22,y);y+=fs(l)*1.35});
  x.font='700 '+u*.7+'px '+fam;x.fillStyle='#00e05a';x.textAlign='right';x.fillText('Wilson',w-pad,y0+pad);
}
function draw(){
  const v=$('lv');let src=S.live?v:S.src;if(!src)return;
  const w=S.live?v.videoWidth:src.naturalWidth,h=S.live?v.videoHeight:src.naturalHeight;if(!w)return;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  x.drawImage(src,0,0);stamp(w,h,S.live?new Date():S.time);
}
function loop(){if(!S.live)return;draw();requestAnimationFrame(loop)}
function view(k){$('empty').style.display=k==='e'?'block':'none';cv.style.display=k==='c'?'block':'none';$('pv').style.display=k==='v'?'block':'none'}
['oDate','oTime','oLoc'].forEach(i=>$(i).onchange=draw);$('tLoc').oninput=draw;$('tNote').oninput=draw;
$('pos').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.pos=b.dataset.p;[...$('pos').children].forEach(c=>c.classList.toggle('on',c===b));draw()};
$('mode').onclick=e=>{const b=e.target.closest('button');if(!b||S.rec)return;S.mode=b.dataset.m;[...$('mode').children].forEach(c=>c.classList.toggle('on',c===b));$('shut').classList.toggle('vid',S.mode==='video')};

function setPhoto(src,when){const im=new Image();im.onload=()=>{S.src=im;S.time=when;S.vblob=null;closeCam();view('c');draw();enable()};im.src=src}
$('fUp').onchange=e=>{const f=e.target.files[0];if(f)setPhoto(URL.createObjectURL(f),f.lastModified?new Date(f.lastModified):new Date());e.target.value=''};
function enable(){['bBotSend','bWA','bDrive','bSave'].forEach(i=>$(i).disabled=false)}

/* ===== Kamera ===== */
async function openCam(){
  try{closeCam();
    try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing,width:{ideal:1280}},audio:true})}
    catch(_){S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing},audio:false})}
    const v=$('lv');v.srcObject=S.stream;await v.play();S.live=true;view('c');
    $('rStart').classList.add('hide');$('rLive').classList.remove('hide');loop();
  }catch(e){toast('Kamera tidak bisa dibuka. Cek izin kamera di browser.')}
}
function closeCam(){if(S.rec)S.rec.stop();S.live=false;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}
  $('rLive').classList.add('hide');$('rStart').classList.remove('hide');if(!S.src&&!S.vblob)view('e')}
$('bCam').onclick=openCam;$('bStop').onclick=closeCam;$('bFlip').onclick=()=>{if(S.rec)return;S.facing=S.facing==='environment'?'user':'environment';openCam()};
$('shut').onclick=()=>{
  if(S.mode==='photo'){const t=new Date(),c=document.createElement('canvas'),v=$('lv');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);setPhoto(c.toDataURL('image/jpeg',.95),t);locate();return}
  if(S.rec){S.rec.stop();return}
  const out=cv.captureStream(30);S.stream.getAudioTracks().forEach(t=>out.addTrack(t));
  const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  const ch=[];const r=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:2500000});S.rec=r;const t0=Date.now();
  r.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('rec').textContent='REC '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  r.onstop=()=>{clearInterval(tick);S.rec=null;$('rec').classList.add('hide');$('shut').classList.remove('on');
    S.vblob=new Blob(ch,{type:mt.split(';')[0]});S.vtime=new Date(t0);S.src=null;
    closeCam();$('pv').src=URL.createObjectURL(S.vblob);view('v');enable()};
  r.start(1000);$('rec').classList.remove('hide');$('shut').classList.add('on');
};

/* ===== Keluaran ===== */
const ext=m=>m.includes('mp4')?'mp4':m.includes('webm')?'webm':'jpg';
const pad=n=>String(n).padStart(2,'0');
async function getOut(){
  if(S.vblob&&!S.src){const t=S.vtime||new Date();return{blob:S.vblob,mime:S.vblob.type,video:1,name:`Wilson_${t.getTime()}.${ext(S.vblob.type)}`}}
  draw();const t=S.time;const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
  return{blob,mime:'image/jpeg',video:0,name:`Wilson_${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.jpg`}}
function caption(){const t=S.vblob&&!S.src?(S.vtime||new Date()):S.time,a=[];
  if($('oDate').checked)a.push(fDate(t));if($('oTime').checked)a.push(fTime(t));
  if($('oLoc').checked){const n=$('tLoc').value.trim();if(n)a.push(n);if(S.lat!=null)a.push(`https://maps.google.com/?q=${S.lat},${S.lon}`)}
  const n=$('tNote').value.trim();if(n)a.push(n);return a.join('\n')}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
const num=()=>$('dest').value.replace(/\D/g,'');

$('bSave').onclick=async()=>{const o=await getOut(),a=document.createElement('a');a.href=URL.createObjectURL(o.blob);a.download=o.name;a.click()};
$('bWA').onclick=async()=>{const o=await getOut(),f=new File([o.blob],o.name,{type:o.mime});
  if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],text:caption()});return}catch(e){if(e.name==='AbortError')return}}
  let n=num();if(n.startsWith('0'))n='62'+n.slice(1);
  open(`https://wa.me/${n}?text=${encodeURIComponent(caption())}`,'_blank');toast('Lampirkan file yang sudah disimpan secara manual.')};

$('bDrive').onclick=async()=>{
  try{const o=await getOut();if(!sessionStorage.dtoken)await google();
    const up=async()=>{const bd='wlsn'+Date.now(),meta=JSON.stringify({name:o.name,description:caption()});
      const body=new Blob([`--${bd}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: ${o.mime}\r\n\r\n`,o.blob,`\r\n--${bd}--`]);
      return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+sessionStorage.dtoken,'Content-Type':'multipart/related; boundary='+bd},body})};
    let r=await up();if(r.status===401){await google();r=await up()}
    toast(r.ok?'Tersimpan di Google Drive.':'Gagal upload ke Drive (cek Drive API aktif).');
  }catch(e){toast('Login Google untuk Drive dibatalkan.')}};

/* ===== Bot WhatsApp (lewat Firestore: sama di HP dan desktop) ===== */
let unG=null,unJ=null,gw=null;
function watchGateway(){unG?.();unG=onSnapshot(doc(db,'wilsonGateway','status'),s=>{gw=s.data()||null;renderGw()},()=>{gw={denied:true};renderGw()})}
function renderGw(){
  let t,ok=false;
  if(!gw)t='Server gateway belum pernah menyala.';
  else if(gw.denied)t='Akun ini belum diizinkan. Pastikan emailnya terdaftar di WILSON_ALLOWED_EMAILS dan sudah terverifikasi.';
  else if(Date.now()-(gw.heartbeat||0)>120000)t='Server gateway mati. Jalankan npm start di komputer atau VPS.';
  else if(gw.connected){t='Terhubung ke WhatsApp ('+gw.me+')';ok=true}
  else if(gw.pairingCode)t='Di WhatsApp: Perangkat tertaut > Tautkan dengan nomor telepon, lalu masukkan kode ini.';
  else if(gw.qr)t='Scan QR dengan WhatsApp: Perangkat tertaut > Tautkan perangkat.';
  else t='Menyiapkan koneksi…';
  const live=gw&&!gw.denied&&Date.now()-(gw.heartbeat||0)<=120000&&!gw.connected;
  $('botSt').textContent=t;
  const q=$('qr');if(live&&gw.qr&&!gw.pairingCode){q.src=gw.qr;q.classList.remove('hide')}else q.classList.add('hide');
  const pb=$('pairBox');if(live&&gw.pairingCode){pb.textContent=gw.pairingCode;pb.classList.remove('hide')}else pb.classList.add('hide');
  $('bBot').textContent=ok?'Bot WA ●':'Bot WA';
  if(ok&&!renderGw.on)toast('WhatsApp tersambung.');renderGw.on=ok;
}
setInterval(renderGw,30000);
const cmd=(action,phone)=>setDoc(doc(db,'wilsonGateway','command'),{id:Date.now(),action,phone:phone||null,by:auth.currentUser.email}).catch(()=>toast('Perintah ditolak. Cek izin akun.'));
$('bBot').onclick=()=>{$('dlg').showModal();if(gw&&!gw.connected)cmd('start')};
$('bClose').onclick=()=>$('dlg').close();
$('bRs').onclick=()=>{cmd('restart');toast('Memulai ulang bot…')};
$('bLo').onclick=()=>{if(confirm('Putuskan WhatsApp dari bot? QR baru akan muncul.'))cmd('logout')};
$('bPair').onclick=()=>{const n=$('pairNum').value.trim();if(!n)return toast('Isi nomor WhatsApp yang akan ditautkan.');cmd('pair',n);toast('Meminta kode…')};

function watchJobs(){unJ?.();unJ=onSnapshot(query(collection(db,'wilsonJobs'),where('owner','==',auth.currentUser.uid)),s=>{
  const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
  $('schList').innerHTML=l.length?l.map(i=>`<div class="sch"><span>${i.to} · ${i.atMs?new Date(i.atMs).toLocaleString('id-ID'):'segera'} · ${i.status}${i.error&&i.status!=='terkirim'?' ('+i.error+')':''}</span>${i.status==='pending'?`<a href="#" data-id="${i.id}">batal</a>`:''}</div>`).join(''):'Belum ada.'},()=>{})}
$('schList').onclick=async e=>{const id=e.target.dataset?.id;if(id){e.preventDefault();await updateDoc(doc(db,'wilsonJobs',id),{status:'batal'}).catch(()=>{})}};

$('bBotSend').onclick=async()=>{
  const n=num();if(!n)return toast('Isi nomor tujuan dulu.');
  const btn=$('bBotSend');btn.disabled=true;
  try{
    const o=await getOut();if(o.blob.size>16e6)throw new Error('ukuran file lebih dari 16 MB');
    const d=await b64(o.blob),w=$('when').value,at=w?new Date(w).getTime():0,CH=700000,parts=Math.ceil(d.length/CH),ref=doc(collection(db,'wilsonJobs'));
    await setDoc(ref,{owner:auth.currentUser.uid,by:auth.currentUser.email,to:n,caption:caption(),video:o.video,mime:o.mime,atMs:at>Date.now()+10000?at:0,chunks:parts,status:'uploading',createdAt:Date.now()});
    for(let i=0;i<parts;i++){toast(`Mengunggah ${i+1}/${parts}…`);await setDoc(doc(ref,'chunks',String(i).padStart(4,'0')),{d:d.slice(i*CH,(i+1)*CH)})}
    await updateDoc(ref,{status:'pending'});
    toast(at>Date.now()+10000?'Terjadwal: '+new Date(at).toLocaleString('id-ID'):'Masuk antrean, bot segera mengirim.');
    S.cfg.last=$('dest').value;saveCfg();
  }catch(e){toast('Gagal: '+(e.code||e.message))}finally{btn.disabled=false}};
</script></body></html>
